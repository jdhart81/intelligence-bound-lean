name: Lean proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build every proof and audit axioms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse sorry and admit
        run: |
          if grep -rnwE --include='*.lean' 'sorry|admit' IntelligenceBound IntelligenceBound.lean; then
            echo "::error::Found sorry or admit in the Lean sources"
            exit 1
          fi

      - name: Build with Lake (Mathlib cache)
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          use-mathlib-cache: true

      - name: Audit axioms of the headline theorems
        run: |
          set -o pipefail
          lake env lean scripts/AxiomAudit.lean | tee axioms.txt
          python3 scripts/check_axioms.py axioms.txt
